<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>428 · Gestisci documenti</title><style>body{font:16px/1.5 system-ui;background:#f5f6ef;color:#173d36;max-width:1000px;margin:auto;padding:24px}button,input,select{font:inherit;padding:10px;border:1px solid #9cafaa;border-radius:6px}button{cursor:pointer;background:white;color:#173d36}a{color:inherit}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;background:white;border:1px solid #dde3da;border-radius:10px;padding:16px;margin:12px 0}.tools{display:flex;gap:10px;flex-wrap:wrap}dialog{max-width:620px;width:90%;box-sizing:border-box;border:1px solid #9cafaa;border-radius:12px}label{display:block;margin:12px 0}label input,label select{display:block;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.danger{color:#a62121}[hidden]{display:none!important}#notice,#error{white-space:pre-line}@media(max-width:600px){.row{display:block}.tools{margin-top:10px}.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/theme.css"><a href="/">Torna alla panoramica</a><h1>Gestisci documenti</h1><p>Correggi o elimina fatture, spese e chiusure. I totali saranno ricalcolati; gli allegati originali restano conservati.</p><div class="tools"><select id="kind" aria-label="Tipo"><option value="closing">Chiusure di cassa</option><option value="invoice">Fatture e spese del registro</option><option value="expense">Spese di gestione</option></select><input id="search" type="search" placeholder="Cerca data, fornitore o numero" aria-label="Cerca"></div><p id="notice" role="status"></p><div id="list"></div><dialog id="editor"><h2>Modifica documento</h2><form id="edit"><label>Data<input name="date" type="date" required></label><div id="invoice-fields"><label>Fornitore / voce<input name="supplier" maxlength="150"></label><label>Numero documento (vuoto per spese del quaderno)<input name="number" maxlength="80"></label><label>Reparto<select name="group"><option>Bar</option><option>Cucina</option><option>Varie</option><option>Da chiarire</option></select></label><div id="expense-fields" hidden><label>Categoria<select name="category"><option>Stipendi dipendenti</option><option>Commercialista</option><option>Acqua</option><option>Corrente</option><option>Guasti e manutenzione</option><option>Innovazioni e miglioramenti</option><option>Amazon</option><option>Cinese</option><option>Supermercato</option></select></label><label>Dettagli<input name="note" maxlength="500"></label></div><label>Totale IVA inclusa €<input name="amountCents" type="number" min="0" max="1000000" step="0.01"></label></div><div id="closing-fields" class="grid"><label>Bar €<input name="barTotal" type="number" min="0" step="0.01"></label><label>Cucina €<input name="kitchenTotal" type="number" min="0" step="0.01"></label><label>Asporto €<input name="takeawayHandwritten" type="number" min="0" step="0.01"></label><label>POS €<input name="pos" type="number" min="0" step="0.01"></label><label>Contanti €<input name="cashAfterOutflow" type="number" min="0" step="0.01"></label><label>Totale chiusura €<input name="reportedTotal" type="number" min="0" step="0.01"></label></div><p id="error" role="alert"></p><div class="tools"><button id="submit">Salva modifiche</button><button type="button" id="cancel">Annulla</button></div></form></dialog><script src="/gestione.js"></script></html>
